<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 90" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="50%" stop-color="#A68B5B"/>
      <stop offset="100%" stop-color="#8C7343"/>
    </linearGradient>
  </defs>
  <style>
    .brand-title {
      font-family: 'Cinzel', 'Cormorant Garamond', 'Georgia', serif;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    .brand-wealth {
      font-family: 'Cinzel', 'Cormorant Garamond', 'Georgia', serif;
      font-size: 38px;
      font-weight: 300;
      letter-spacing: 0.12em;
    }
    .brand-subtitle {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.42em;
    }
  </style>
  <!-- Main Brand Name -->
  <g transform="translate(0, 42)">
    <!-- LEGACYONE in Gold -->
    <text x="0" y="0" class="brand-title" fill="url(#goldGradient)">LEGACYONE</text>
    <!-- WEALTH in Forest Green / Neutral -->
    <text x="315" y="0" class="brand-wealth" fill="#0F2D2E">WEALTH</text>
  </g>
  <!-- Thin Accent Line -->
  <line x1="2" y1="56" x2="520" y2="56" stroke="#A68B5B" stroke-width="0.75" stroke-opacity="0.4" />
  <!-- Subtitle Tagline -->
  <text x="4" y="74" class="brand-subtitle" fill="#A68B5B">CREATE, GROW, PRESERVE – LEGACY</text>
</svg>
