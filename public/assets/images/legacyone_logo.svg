<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;display=swap');
      .brand-title {
        font-family: 'Cormorant Garamond', 'EB Garamond', 'Georgia', 'Times New Roman', serif;
        font-size: 50px;
        font-weight: 600;
      }
      .brand-legacy {
        fill: #B38634;
      }
      .brand-wealth {
        fill: #145939;
      }
      .brand-tagline {
        font-family: 'Cormorant Garamond', 'EB Garamond', 'Georgia', 'Times New Roman', serif;
        font-size: 21px;
        font-weight: 500;
        fill: #B38634;
        letter-spacing: 0.14em;
        text-anchor: middle;
      }
    </style>
  </defs>
  
  <!-- Main Brand Title -->
  <g transform="translate(10, 62)">
    <text x="0" y="0" class="brand-title">
      <tspan class="brand-legacy">LegacyOne</tspan>
      <tspan dx="14" class="brand-wealth">Wealth</tspan>
    </text>
  </g>

  <!-- Centered Tagline -->
  <text x="260" y="112" class="brand-tagline">Create, Grow, Preserve – Legacy</text>
</svg>
